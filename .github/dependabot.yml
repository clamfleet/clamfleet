#
# Dependabot (M6c decision 6). What it does here, and what it does not:
#
#   - GitHub Actions, monthly: every action is pinned by commit SHA, and a pin never moves by itself.
#     Dependabot proposes the new SHA with its version comment, and the proposal runs the full CI.
#   - Docker, monthly: the two base images of deploy/test/ci/Dockerfile are pinned by digest (the
#     ClamAV image's tags carry no date and are rebuilt daily, so only the digest is a pin). A
#     digest that moves is a different set of frozen signatures; it goes through CI like any change.
#     The level-2 Dockerfiles (deploy/test/ci/deb and rpm) have an entry each, one per directory
#     rather than a `directories:` list, which this file does not rely on. The ClamAV pin is in
#     all three: deploy/test/ci/signatures_test.sh fails until the three agree, so merge the
#     three bumps together.
#     The four base images of the l2 legs are each pinned to the release the leg is named for (Debian
#     12, Ubuntu 22.04, Rocky 9, AlmaLinux 10): a new major is a different leg, added on purpose with
#     its own facts row, never by a bot (it proposed Rocky 9 to 10). So semver-major updates are
#     ignored for them; digest and patch updates still come.
#   - Go modules: SECURITY updates only (open-pull-requests-limit: 0 turns the routine version
#     updates off and leaves the security ones on). Spec section 5 makes routine dependency updates a
#     deliberate act of the maintainer, not a bot's monthly pull request.
#   - Not configured on purpose: npm. e2e/web pins @playwright/test 1.63.0 to the browser build the
#     maintainer's machine has; a bumped Playwright would want other browsers.
#
# Dependabot's commits carry no sign-off; hack/ci/dco.sh exempts them (a human merges the pull request).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    directory: /deploy/test/ci
    schedule:
      interval: monthly
    commit-message:
      prefix: "test(e2e)"
  - package-ecosystem: docker
    directory: /deploy/test/ci/deb
    schedule:
      interval: monthly
    ignore:
      - dependency-name: debian
        update-types: ["version-update:semver-major"]
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "test(e2e)"
  - package-ecosystem: docker
    directory: /deploy/test/ci/rpm
    schedule:
      interval: monthly
    ignore:
      - dependency-name: rockylinux/rockylinux
        update-types: ["version-update:semver-major"]
      - dependency-name: almalinux
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "test(e2e)"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
