#
# Dependabot (M6c decision 6). What it does here, and what it does not:
#
#   - GitHub Actions, monthly: every action is pinned by commit SHA, and a pin never moves by itself.
#     Dependabot proposes the new SHA with its version comment, and the proposal runs the full CI.
#   - Docker, monthly: the two base images of deploy/test/ci/Dockerfile are pinned by digest (the
#     ClamAV image's tags carry no date and are rebuilt daily, so only the digest is a pin). A
#     digest that moves is a different set of frozen signatures; it goes through CI like any change.
#   - Go modules: SECURITY updates only (open-pull-requests-limit: 0 turns the routine version
#     updates off and leaves the security ones on). Spec section 5 makes routine dependency updates a
#     deliberate act of the maintainer, not a bot's monthly pull request.
#   - Not configured on purpose: npm. e2e/web pins @playwright/test 1.63.0 to the browser build the
#     maintainer's machine has; a bumped Playwright would want other browsers.
#
# Dependabot's commits carry no sign-off; hack/ci/dco.sh exempts them (a human merges the pull request).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    directory: /deploy/test/ci
    schedule:
      interval: monthly
    commit-message:
      prefix: "test(e2e)"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
