#
# The agent's directories, RHEL family: the modes of milestone 5. clamd's user (group
# clamscan) must reach spool/events, so /var/lib/clamfleet and spool/ are group-traversable
# and spool/ is setgid so subdirectories inherit the group; `run` creates spool/events and
# the agent-only directories itself.
d /var/lib/clamfleet 0750 clamfleet clamscan -
d /var/lib/clamfleet/spool 2750 clamfleet clamscan -
# SELinux (RHEL family only): a file created later inherits its parent's type, so spool/events and
# spool/usage must exist BEFORE the module's restorecon in the postinstall labels them
# clamfleet_spool_t; if `run` created them first they would be var_lib_t and clamd's domain
# (antivirus_t) could not write them. `run` accepts them as they are (owner, group and modes of
# milestone 5; it gives the empty usage file its first record).
d /var/lib/clamfleet/spool/events 3770 clamfleet clamscan -
f /var/lib/clamfleet/spool/usage 0660 clamfleet clamscan -
