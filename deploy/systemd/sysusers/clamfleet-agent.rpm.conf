#
# The agent's user, RHEL family. It joins clamd's group (clamscan, from the EPEL clamd package) so that clamd's
# user and the agent share the spool, and systemd-journal to read freshclam's journal.
# `m` creates a group that is missing: the package depends on clamd, so clamscan exists first.
u clamfleet - "ClamFleet agent" /var/lib/clamfleet
m clamfleet clamscan
# EPEL's clamd keeps its socket directory /run/clamd.scan as clamscan:virusgroup 0710 (clamd's user is in
# virusgroup, the stock clamscan group is NOT the directory's group): without this group the agent cannot
# reach clamd's socket and every report says clamd is down (found on AlmaLinux 9, docs/testing.md).
m clamfleet virusgroup
m clamfleet systemd-journal
