#
# The agent's user, Debian family. It joins clamd's group (clamav) so that clamd's
# user and the agent share the spool, and systemd-journal to read freshclam's journal.
# `m` creates a group that is missing: the package depends on clamav-daemon, so clamav exists first.
u clamfleet - "ClamFleet agent" /var/lib/clamfleet
m clamfleet clamav
m clamfleet systemd-journal
